<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card Ui Design</title>
    <!--CSS-->
    <link rel="stylesheet" href="style.css">
    <!--Baxicons CSS-->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div class="profile-card">
        <div class="image">
            <img src="profile2.jpg" alt="" class="profile-img">
        </div>
            <div class="text-data">
                <span class="name">Sanidhya Chauhan</span>
                <span class="job">Front End Developer</span>
            </div>
            <div class="media-buttons">
    <!-- LinkedIn -->
    <a href="https://www.linkedin.com/" style="background: #4267b2" target="_blank" class="link">
        <i class='bx bxl-linkedin'></i>
    </a>

    <!-- GitHub -->
    <a href="https://github.com/"style="background: #4267b2" target="_blank" class="link">
        <i class='bx bxl-github'></i>
    </a>

    <!-- LeetCode -->
    <a href="https://leetcode.com/" style="background: #4267b2" target="_blank" class="link">
        <i class='bx bx-code-alt'></i>
    </a>
</div>
       <div class="buttons">
        <button class="button">Contact</button>
        <button class="button">Message</button>
       </div>
       
            
        </div>
       </div>
    </div>
</body>
</html>
